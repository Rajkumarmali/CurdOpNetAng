<div
  class="container d-flex justify-content-center align-items-center min-vh-100 bg-light">
  <div class="card shadow-lg p-4 border-0"
    style="width: 100%; max-width: 420px; border-radius: 1rem;">
    <h3 class="text-center mb-4 fw-bold text-primary">Welcome Back</h3>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input
          type="email"
          class="form-control form-control-lg"
          placeholder="Enter your email"
          [(ngModel)]="user.email"
          name="email"
          required />
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <input
          type="password"
          class="form-control form-control-lg"
          placeholder="Enter your password"
          [(ngModel)]="user.password"
          name="password"
          required />
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        Login
      </button>
    </form>

    <div class="text-center mt-3">
      <span class="text-muted">Don’t have an account?</span>
      <a [routerLink]="['']"
        class="text-primary fw-semibold text-decoration-none ms-1">
        Sign Up
      </a>
    </div>
  </div>
</div>
