<div class="container mt-4 position-relative">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-primary mb-0">Student Management</h3>
    <button class="btn btn-success px-4 py-2 fw-semibold" (click)="addStudent()">
      + Add New Student
    </button>
  </div>

  <!-- Student Table -->
  <div class="card shadow-sm rounded-3 border-0">
    <div class="card-body">
      <table class="table table-hover align-middle">
        <thead class="table-primary">
          <tr>
            <th scope="col">S No.</th>
            <th scope="col">ID</th>
            <th scope="col">Name</th>
            <th scope="col">Email</th>
            <th scope="col">Phone No.</th>
            <th scope="col">Address</th>
            <th scope="col">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let s of studentData; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ s.id }}</td>

            <td *ngIf="s.id!==updateId">{{ s.fullName }}</td>
            <td *ngIf="s.id===updateId">
              <input [(ngModel)]="updateStudentData.fullName"  class="form-control" />
            </td>

            <td *ngIf="s.id!==updateId">{{ s.email }}</td>
            <td *ngIf="s.id===updateId">
              <input [(ngModel)]="updateStudentData.email" class="form-control" />
            </td>

            <td *ngIf="s.id!==updateId">{{ s.phone }}</td>
             <td *ngIf="s.id===updateId">
              <input [(ngModel)]="updateStudentData.phone"  class="form-control" />
            </td>

            <td *ngIf="s.id!==updateId">{{ s.address }}</td>
            <td *ngIf="s.id===updateId">
              <input [(ngModel)]="updateStudentData.address" class="form-control" />
            </td>

            <td>
              <ng-container *ngIf="s.id!==updateId; else saveCancel">
                 <button (click)="onUpdate(s.id)">Update</button>
                 <button (click)="onDelete(s.id)">Delete</button>
              </ng-container>
              <ng-template #saveCancel>
                   <button (click)="saveUpdate()">Save</button>
                   <button (click)="canelEdit()">Cancel</button>
              </ng-template>
            </td>  
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Overlapping Add Student Form -->
  <div
    class="overlay"
    *ngIf="addStudentModel"
    (click)="addStudentModel = false"
  ></div>

  <div class="popup-form card shadow-lg border-0" *ngIf="addStudentModel">
    <div class="card-body">
      <h4 class="fw-bold text-primary mb-3 text-center">Add New Student</h4>

      <form (ngSubmit)="onAddStudent()">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Full Name</label>
            <input
              type="text"
              class="form-control"
              placeholder="Enter full name"
              [(ngModel)]="addStudentDetail.fullName"
              name="fullName"
              required
            />
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Email</label>
            <input
              type="email"
              class="form-control"
              placeholder="Enter email"
              [(ngModel)]="addStudentDetail.email"
              name="email"
              required
            />
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Phone</label>
            <input
              type="text"
              class="form-control"
              placeholder="Enter phone number"
              [(ngModel)]="addStudentDetail.phone"
              name="phone"
              required
            />
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Address</label>
            <input
              type="text"
              class="form-control"
              placeholder="Enter address"
              [(ngModel)]="addStudentDetail.address"
              name="address"
              required
            />
          </div>
        </div>

        <div class="mt-4 d-flex justify-content-end">
          <button
            type="button"
            class="btn btn-outline-secondary px-4 py-2 me-2 fw-semibold"
            (click)="addStudentModel = false"
          >
            Cancel
          </button>
          <button type="submit" class="btn btn-primary px-5 py-2 fw-semibold">
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
