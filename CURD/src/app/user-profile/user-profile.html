<!-- USER CARD SECTION -->
<div class="container mt-5" *ngIf="!resetPassModel">
  <div class="card shadow-lg mx-auto border-0 rounded-4 p-3"
    style="max-width: 420px;">
    <div class="card-body text-center">

      <h4 class="text-primary mb-4 fw-bold">User Profile</h4>

      <p class="mb-2">
        <strong>First Name:</strong> {{ userDetail.firstName }}
      </p>

      <p class="mb-2">
        <strong>Last Name:</strong> {{ userDetail.lastName }}
      </p>

      <p class="mb-3">
        <strong>Email:</strong> {{ userDetail.email }}
      </p>

      <button class="btn btn-primary px-4 py-2 rounded-pill fw-semibold"
        (click)="resetPassModel = true">
        Reset Password
      </button>

    </div>
  </div>
</div>

<!-- CUSTOM ANGULAR MODAL -->
<div *ngIf="resetPassModel"
  class="custom-backdrop d-flex align-items-center justify-content-center">
  <div class="custom-modal shadow-lg rounded-4 p-4 bg-white"
    style="width: 380px;">

    <h5 class="mb-4 fw-bold text-center text-primary">Reset Password</h5>

    <div class="mb-3">
      <label class="form-label fw-semibold">Old Password</label>
      <input
        type="password"
        class="form-control rounded-pill px-3"
        placeholder="Enter old password"
        [(ngModel)]="updatePassword.oldPassword" />
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">New Password</label>
      <input
        type="password"
        class="form-control rounded-pill px-3"
        placeholder="Enter new password"
        [(ngModel)]="updatePassword.newPassword" />
    </div>

    <div class="text-end mt-4">
      <button class="btn btn-outline-secondary rounded-pill px-4 me-2"
        (click)="resetPassModel = false">
        Cancel
      </button>

      <button class="btn btn-primary rounded-pill px-4"
        (click)="onUpdatePassword()">
        Update
      </button>
    </div>

  </div>
</div>
